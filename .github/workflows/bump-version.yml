# Raises the pack's version on a pull request when a maintainer approves it, so every merge to main carries a new
# version. The label on the pull request picks the part to raise:
#   release:major, release:minor, release:patch (the default when there is no label), or release:none.
# It sets Version in maester-pack.json one step above the version on main, turns "## Unreleased" in CHANGELOG.md
# into that version and pushes the commit to the pull request. When an approved pull request is updated (for
# example after main moved on), it raises the version again if main has caught up with it.
#
# A push made with the workflow's token starts no other workflow, so the pack check would never run on the new
# commit. This workflow runs it (check-pack.yml) on that commit and reports the result as the "check" the ruleset
# requires. It runs for branches of this repository only; a pull request from a fork is raised by hand.
name: Bump version on approval

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

concurrency:
  group: bump-version-${{ github.event.pull_request.number }}

jobs:
  bump:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event_name == 'pull_request' || github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Raise the version
        id: bump
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          # Read the pull request now, not from the event, so a label added after the approval still counts.
          $pr = gh pr view $env:PR_NUMBER --json labels,reviewDecision | ConvertFrom-Json
          if ($env:EVENT -eq 'pull_request' -and $pr.reviewDecision -ne 'APPROVED') {
            Write-Output 'The pull request is not approved yet: the version is raised when it is.'
            return
          }
          $labels = @($pr.labels.name)
          if ($labels -contains 'release:none') {
            Write-Output 'The pull request has release:none: the version stays as it is.'
            return
          }
          $part = if ($labels -contains 'release:major') { 'major' } elseif ($labels -contains 'release:minor') { 'minor' } else { 'patch' }

          git fetch --quiet origin main
          $base = [version](git show origin/main:maester-pack.json | ConvertFrom-Json).Version
          $text = Get-Content -LiteralPath maester-pack.json -Raw
          $current = [version]($text | ConvertFrom-Json).Version
          if ($current -gt $base) {
            Write-Output "The version is already $current, above $base on main: nothing to raise."
            return
          }
          $next = switch ($part) {
            'major' { '{0}.0.0' -f ($base.Major + 1) }
            'minor' { '{0}.{1}.0' -f $base.Major, ($base.Minor + 1) }
            default { '{0}.{1}.{2}' -f $base.Major, $base.Minor, ([math]::Max($base.Build, 0) + 1) }
          }

          # Change only the value of the manifest's own Version, so the rest of the file keeps its layout.
          $text = ([regex]'("Version"\s*:\s*")[^"]*(")').Replace($text, "`${1}$next`${2}", 1)
          if (($text | ConvertFrom-Json).Version -ne $next) { throw 'Could not change Version in maester-pack.json.' }
          [System.IO.File]::WriteAllText((Resolve-Path maester-pack.json), $text)

          # The changelog: "## Unreleased" becomes the version; without it, the pull request's title is the entry.
          $log = Get-Content -LiteralPath CHANGELOG.md -Raw
          $unreleased = [regex]'(?m)^## Unreleased[ \t]*\r?$'
          if ($unreleased.IsMatch($log)) {
            $log = $unreleased.Replace($log, "## $next", 1)
          } else {
            $entry = "## $next`n`n- $env:PR_TITLE (#$env:PR_NUMBER)`n`n"
            $first = [regex]::Match($log, '(?m)^## ')
            $log = if ($first.Success) { $log.Insert($first.Index, $entry) } else { $log.TrimEnd() + "`n`n" + $entry }
          }
          [System.IO.File]::WriteAllText((Resolve-Path CHANGELOG.md), $log)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maester-pack.json CHANGELOG.md
          git commit --quiet -m "Version $next"
          git push --quiet origin "HEAD:$($env:HEAD_REF)"
          "sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "version=$next" >> $env:GITHUB_OUTPUT
          "Raised the version from $current to **$next** ($part; main has $base)." >> $env:GITHUB_STEP_SUMMARY

  validate:
    needs: bump
    if: needs.bump.outputs.sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/check-pack.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  report:
    needs: [bump, validate]
    if: always() && needs.bump.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Report the check on the new commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.bump.outputs.sha }}
          VERSION: ${{ needs.bump.outputs.version }}
          RESULT: ${{ needs.validate.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          conclusion=failure
          if [ "$RESULT" = "success" ]; then conclusion=success; fi
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name=check -f head_sha="$SHA" -f status=completed -f conclusion="$conclusion" -f details_url="$RUN_URL" \
            -f "output[title]=Pack check of version $VERSION: $RESULT" \
            -f "output[summary]=The version commit was checked by the Bump version on approval run: $RUN_URL"
