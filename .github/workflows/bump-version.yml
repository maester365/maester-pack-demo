# Raises the pack's version on a pull request when a maintainer approves it, so every merge to main is a new
# release (see release.yml). The label on the pull request picks the part to raise:
#   release:major, release:minor, release:patch (the default when there is no label), or release:none.
# It changes Version in maester-pack.json and turns "## Unreleased" in CHANGELOG.md into the new version, then
# starts the pack check again, because a push by this workflow does not start other workflows by itself.
# It runs for branches of this repository only; a pull request from a fork is raised by hand.
name: Bump version on approval

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: bump-version-${{ github.event.pull_request.number }}

jobs:
  bump:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Raise the version
        id: bump
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Read the labels now, not from the event, so a label added after the approval still counts.
          $labels = @(gh pr view $env:PR_NUMBER --json labels --jq '.labels[].name')
          if ($labels -contains 'release:none') {
            Write-Output 'The pull request has release:none: the version stays as it is.'
            return
          }
          $part = if ($labels -contains 'release:major') { 'major' } elseif ($labels -contains 'release:minor') { 'minor' } else { 'patch' }

          git fetch --quiet origin main
          $base = [version](git show origin/main:maester-pack.json | ConvertFrom-Json).Version
          $text = Get-Content -LiteralPath maester-pack.json -Raw
          $current = [version]($text | ConvertFrom-Json).Version
          if ($current -ne $base) {
            Write-Output "The version is already $current (main has $base): nothing to raise."
            return
          }
          $next = switch ($part) {
            'major' { '{0}.0.0' -f ($base.Major + 1) }
            'minor' { '{0}.{1}.0' -f $base.Major, ($base.Minor + 1) }
            default { '{0}.{1}.{2}' -f $base.Major, $base.Minor, ([math]::Max($base.Build, 0) + 1) }
          }

          # Change only the value of the manifest's own Version, so the rest of the file keeps its layout.
          $text = ([regex]'("Version"\s*:\s*")[^"]*(")').Replace($text, "`${1}$next`${2}", 1)
          if (($text | ConvertFrom-Json).Version -ne $next) { throw 'Could not change Version in maester-pack.json.' }
          [System.IO.File]::WriteAllText((Resolve-Path maester-pack.json), $text)

          # The changelog: "## Unreleased" becomes the version; without it, the pull request's title is the entry.
          $log = Get-Content -LiteralPath CHANGELOG.md -Raw
          $unreleased = [regex]'(?m)^## Unreleased[ \t]*\r?$'
          if ($unreleased.IsMatch($log)) {
            $log = $unreleased.Replace($log, "## $next", 1)
          } else {
            $entry = "## $next`n`n- $env:PR_TITLE (#$env:PR_NUMBER)`n`n"
            $first = [regex]::Match($log, '(?m)^## ')
            $log = if ($first.Success) { $log.Insert($first.Index, $entry) } else { $log.TrimEnd() + "`n`n" + $entry }
          }
          [System.IO.File]::WriteAllText((Resolve-Path CHANGELOG.md), $log)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maester-pack.json CHANGELOG.md
          git commit --quiet -m "Version $next"
          git push --quiet origin "HEAD:$($env:HEAD_REF)"
          "version=$next" >> $env:GITHUB_OUTPUT
          "Raised the version from $base to **$next** ($part)." >> $env:GITHUB_STEP_SUMMARY

      - name: Check the pack again
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run check-pack.yml --ref "$HEAD_REF"
